# Traefik on EKS: a real AWS load balancer instead of Kind's hostPort.
# The source-IP allow-list is passed on the command line (make eks-up MY_IP=...) so it is never committed.
ingressClass:
  enabled: true
  isDefaultClass: true
deployment:
  replicas: 2
service:
  type: LoadBalancer
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: nlb   # Network Load Balancer
logs:
  access:
    enabled: true
