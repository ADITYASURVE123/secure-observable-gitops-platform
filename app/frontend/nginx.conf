server {
  listen 8080;                      # unprivileged port: the container never needs root
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Content-Security-Policy "default-src 'self'; style-src 'self'; script-src 'self'" always;

  # Kubernetes probe endpoint, independent of the backend.
  location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }

  # /metrics is for Prometheus (scraping the pod directly), not for the public internet.
  location = /api/metrics { return 404; }

  # Drill-only crash hook: reachable from inside the cluster, never through the ingress.
  location ^~ /api/chaos/ { return 404; }

  # Same-origin API access: no CORS config needed, and the API stays a ClusterIP service.
  location /api/ {
    proxy_pass http://api:8000/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 15s;
  }

  location = /index.html { add_header Cache-Control "no-cache" always; }
  location / { try_files $uri $uri/ /index.html; }
}
