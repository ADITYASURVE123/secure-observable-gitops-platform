# Optional add-on (not part of the default sync). Enabled by `make jenkins-monitor-up`.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - service.yaml
  - servicemonitor.yaml
  - rules.yaml
configMapGenerator:
  - name: grafana-dashboard-jenkins
    files:
      - jenkins-build-health.json
    options:
      disableNameSuffixHash: true
      labels: { grafana_dashboard: "1" }
      annotations: { grafana_folder: "CI" }
