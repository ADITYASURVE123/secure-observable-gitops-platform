apiVersion: v1
kind: Namespace
metadata:
  name: orders
  labels:
    app.kubernetes.io/part-of: orders-platform
    # Pod Security Admission: enforce the "restricted" profile. Every workload below
    # is written to pass it (non-root, no privilege escalation, dropped caps, seccomp).
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
