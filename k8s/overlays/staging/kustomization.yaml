# GitOps overlay. This is the ONLY place the CI pipeline writes to: it bumps the two
# `newTag` values below and commits. ArgoCD (Phase 3) then syncs the change.
# Replace "your-github-user" with your GitHub account/org before the first pipeline run.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
configMapGenerator:
  - name: api-config
    behavior: merge
    literals:
      - APP_ENV=staging
images:
  - name: orders-api
    newName: ghcr.io/your-github-user/orders-api
    newTag: bootstrap
  - name: orders-frontend
    newName: ghcr.io/your-github-user/orders-frontend
    newTag: bootstrap
