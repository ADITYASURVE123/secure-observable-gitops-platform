# Local Kind overlay: images are built on the laptop and side-loaded (`kind load`),
# so there is no registry and tag `dev` is never pulled.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
configMapGenerator:
  - name: api-config
    behavior: merge
    literals:
      - APP_ENV=dev
replicas:
  - name: api
    count: 1
  - name: frontend
    count: 1
images:
  - name: orders-api
    newName: orders-api
    newTag: dev
  - name: orders-frontend
    newName: orders-frontend
    newTag: dev
