# UI at http://argocd.localhost:8080 (*.localhost resolves to 127.0.0.1 in modern browsers and curl).
# The Argo CD CLI should use `kubectl port-forward` instead: gRPC does not pass cleanly through this ingress.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-server
  namespace: argocd
spec:
  ingressClassName: traefik
  rules:
    - host: argocd.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: argocd-server
                port:
                  name: http
