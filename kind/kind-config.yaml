# 1 control-plane + 2 workers: enough to make topology spread, PodDisruptionBudgets
# and node-drain behaviour real, while still fitting on a laptop.
# Node image is pinned by digest (kind v0.33.0 release notes list it).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: gitops-platform
nodes:
  - role: control-plane
    image: kindest/node:v1.35.8@sha256:07b2536e30b803ed61d1677a79df6115f798ce64c80f9e22f6ed45afd09323c0
    extraPortMappings:
      # Host 8080/8443 (not 80/443) so no root or rootless-docker tricks are needed.
      # Traefik binds hostPort 80/443 on this node, so these reach the ingress controller.
      - { containerPort: 80, hostPort: 8080, protocol: TCP }
      - { containerPort: 443, hostPort: 8443, protocol: TCP }
  - role: worker
    image: kindest/node:v1.35.8@sha256:07b2536e30b803ed61d1677a79df6115f798ce64c80f9e22f6ed45afd09323c0
  - role: worker
    image: kindest/node:v1.35.8@sha256:07b2536e30b803ed61d1677a79df6115f798ce64c80f9e22f6ed45afd09323c0
